<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:1200px;margin:35px auto;padding:20px}
.card{background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}
h1{margin-top:0}.muted,.small{color:#667085}
.field{margin:16px 0}label{display:block;font-weight:600;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font-size:15px;box-sizing:border-box}
button{padding:10px 14px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.primary{background:#172033;color:white}.secondary{background:#eef2f7;color:#172033}
.danger{background:#fee4e2;color:#b42318}
.success{display:none;margin-top:15px;padding:12px;border-radius:9px;background:#ecfdf3;color:#027a48}
.error{display:none;margin-top:15px;padding:12px;border-radius:9px;background:#fef3f2;color:#b42318}
#dashboard{display:none}#login{max-width:430px;margin:80px auto}
.adminhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}
th,td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:middle}
td img{width:90px;height:90px;object-fit:cover;border-radius:8px;display:block;margin-bottom:7px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.save{background:#e8f3ff;color:#075985;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:700;display:inline-block}
</style>
</head>
<body>
<div class="wrap">

<section class="card" id="login">
<h1>Admin Sign In</h1>
<p class="muted">Private dashboard — authorized admin account only.</p>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="primary" id="signin">Sign In</button>
<div id="loginError" class="error"></div>
</section>

<section class="card" id="dashboard">
<div class="adminhead">
<div>
<h1>Private Admin Dashboard</h1>
<p class="small">Only authenticated admin users can view this data.</p>
</div>
<button class="secondary" id="logout">Sign Out</button>
</div>

<div id="adminError" class="error"></div>
<div id="adminSuccess" class="success"></div>

<div class="tablewrap">
<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Internship</th>
<th>IP</th>
<th>Location</th>
<th>Photo</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
</section>
</div>

<script>
const SUPABASE_URL="https://uqbxuoqcwfpbwsiouhae.supabase.co";
const SUPABASE_KEY="sb_publishable_QKMhCZinBSMjnA0jzz8_UQ_jkhkQzuh";
const PHOTO_BUCKET="application-photos";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
   "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[c]));
}

function showError(text){
 $("adminError").textContent=text;
 $("adminError").style.display="block";
 $("adminSuccess").style.display="none";
}

function showSuccess(text){
 $("adminSuccess").textContent=text;
 $("adminSuccess").style.display="block";
 $("adminError").style.display="none";
}

/* Create a fresh signed URL for the private photo. */
async function getPhotoUrl(path){
 const result=await db.storage.from(PHOTO_BUCKET).createSignedUrl(path,3600);
 if(result.error) throw result.error;
 return result.data.signedUrl;
}

async function loadDashboard(){
 const {data:{session}}=await db.auth.getSession();

 if(!session){
   $("login").style.display="block";
   $("dashboard").style.display="none";
   return;
 }

 $("login").style.display="none";
 $("dashboard").style.display="block";

 const q=await db.from("visitor_permissions")
   .select("id,full_name,email,internship,ip_address,latitude,longitude,photo_path")
   .order("created_at",{ascending:false});

 if(q.error){
   showError("Could not load applications. Check the Supabase SELECT policy.");
   return;
 }

 $("rows").innerHTML="";

 for(const r of q.data||[]){
   let photoCell="No photo";
   let actionCell="";

   if(r.photo_path){
     try{
       const url=await getPhotoUrl(r.photo_path);

       photoCell=
         `<img src="${url}" alt="Applicant photo">
          <a class="save" href="${url}" target="_blank" rel="noopener">Open / Save</a>`;

       actionCell=
         `<a class="save" href="${url}" target="_blank" rel="noopener">Save Photo</a>
          <button class="danger" onclick="deleteApplication('${esc(r.id)}','${esc(r.photo_path)}')">Delete</button>`;
     }catch(e){
       photoCell="Photo unavailable";
       actionCell=`<button class="danger" onclick="deleteApplication('${esc(r.id)}','${esc(r.photo_path||"")}')">Delete</button>`;
     }
   }else{
     actionCell=`<button class="danger" onclick="deleteApplication('${esc(r.id)}','')">Delete</button>`;
   }

   const loc=r.latitude!=null
     ? `${Number(r.latitude).toFixed(5)}, ${Number(r.longitude).toFixed(5)}`
     : "Not provided";

   $("rows").insertAdjacentHTML("beforeend",
    `<tr>
      <td>${esc(r.full_name)}</td>
      <td>${esc(r.email)}</td>
      <td>${esc(r.internship)}</td>
      <td>${esc(r.ip_address||"Not provided")}</td>
      <td>${esc(loc)}</td>
      <td>${photoCell}</td>
      <td><div class="actions">${actionCell}</div></td>
    </tr>`
   );
 }
}

async function deleteApplication(id,photoPath){
 if(!confirm("Delete this application and its saved photo permanently?")) return;

 try{
   if(photoPath){
     const storageDelete=await db.storage.from(PHOTO_BUCKET).remove([photoPath]);
     if(storageDelete.error) throw storageDelete.error;
   }

   const deleted=await db.from("visitor_permissions").delete().eq("id",id);
   if(deleted.error) throw deleted.error;

   showSuccess("Application and photo deleted.");
   await loadDashboard();
 }catch(e){
   console.error(e);
   showError("Delete failed. Check the Supabase DELETE policies.");
 }
}

$("signin").onclick=async()=>{
 $("loginError").style.display="none";

 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email||!password){
   $("loginError").textContent="Enter your admin email and password.";
   $("loginError").style.display="block";
   return;
 }

 $("signin").disabled=true;

 const {error}=await db.auth.signInWithPassword({email,password});

 $("signin").disabled=false;

 if(error){
   $("loginError").textContent="Login failed. Check your email and password.";
   $("loginError").style.display="block";
   return;
 }

 loadDashboard();
};

$("logout").onclick=async()=>{
 await db.auth.signOut();
 loadDashboard();
};

db.auth.onAuthStateChange(()=>loadDashboard());
loadDashboard();
</script>
</body>
</html>
